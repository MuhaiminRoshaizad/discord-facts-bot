# Cloudflare Workers configuration.
#
# Secrets are NOT set here. Provide them with `wrangler secret put`:
#   DISCORD_PUBLIC_KEY      verifies interaction signatures
#   DISCORD_APPLICATION_ID  used when registering commands
#   DISCORD_BOT_TOKEN       authenticates REST calls

name = "mooji"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Daily at 16:00 UTC, which is 00:00 Malaysia time. Rolls the day's Rift
# modifier and posts the leaderboard digest. Resolve regeneration is computed
# lazily on read and deliberately does not depend on this firing.
[triggers]
crons = ["0 16 * * *"]

# The compendium, generated by `npm run wiki` from src/game/content.
#
# The asset layer runs ahead of the Worker and answers anything it can match,
# which includes returning 405 to a POST at "/". Discord's endpoint validation
# POSTs and requires a 401, so the interactions endpoint lives at /interactions
# where no asset exists and the request falls through to the Worker.
#
# not_found_handling is deliberately left at its default: the
# single-page-application setting would serve index.html for /interactions too,
# and the Worker would never see a single command.
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "mooji"
database_id = "405f09b8-cb53-487a-9bd6-db60c13506c2"

[observability]
enabled = true
